<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monzati Expo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: una pantalla de presentación. Cabecera con reloj, escenario central, pie con avance y orador. Colores del logo: azul, violeta, azul marino. */
:root{
  --bg:#FFFFFF; --bg2:#F3F5FC; --fg:#1B1F3B; --mut:#5B6082; --line:#DDE2F5; --card:#FFFFFF;
  --blue:#3A63E8; --violet:#7A3FE0; --acc:#5B3FE0; --ok:#1F7A3A; --warn:#B45309; --bad:#B42318;
  --grad:linear-gradient(135deg,#3A63E8,#7A3FE0); --shadow:0 8px 24px #E4E8F8;
  --head:'Jost','Trebuchet MS',Arial,sans-serif; --text:'Inter',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141733;--bg2:#1B1F3F;--fg:#F2F4FF;--mut:#C5CBF0;--line:#353B72;--card:#1F2347;--acc:#A9BBFF;--ok:#6EE7A0;--warn:#FBBF24;--bad:#FCA5A5;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141733;--bg2:#1B1F3F;--fg:#F2F4FF;--mut:#C5CBF0;--line:#353B72;--card:#1F2347;--acc:#A9BBFF;--ok:#6EE7A0;--warn:#FBBF24;--bad:#FCA5A5;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:44px;width:auto}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--head);font-size:22px;letter-spacing:3px;font-weight:500}
.where{flex:1;min-width:0;text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.tools{display:flex;gap:8px;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-family:var(--head);font-size:30px;font-weight:500;min-width:92px;text-align:right}
.clock.warn{color:var(--warn)}.clock.over{color:var(--bad)}
.tb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px}
.tb:hover{border-color:var(--blue)}
main{flex:1;min-height:0;display:flex;overflow:auto}
#stage{flex:1;min-width:0;padding-block:28px;display:flex;flex-direction:column;justify-content:center}
.scene{width:100%;max-width:1280px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.scene{animation:in .45s ease-out both}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
.eyebrow{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:600;margin:0 0 14px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
h1{font-size:clamp(48px,9vw,132px);font-weight:300;letter-spacing:.08em;line-height:1}
h2{font-size:clamp(34px,5vw,68px);font-weight:300;letter-spacing:.02em;line-height:1.08}
h3{font-size:clamp(22px,2.4vw,30px);font-weight:500;color:var(--acc);margin-bottom:6px}
.rule{width:180px;height:6px;border-radius:3px;background:var(--grad);margin:22px 0 30px}
.lead{font-size:clamp(18px,2vw,26px);line-height:1.4;margin:0;max-width:60ch}
.mut{color:var(--mut);font-size:clamp(15px,1.5vw,20px);line-height:1.5;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);min-width:0}
.tile p{margin:0;color:var(--mut);font-size:clamp(15px,1.4vw,19px);line-height:1.45}
.num{font-family:var(--head);font-weight:300;font-size:clamp(34px,4vw,56px);color:var(--acc);line-height:1;margin-bottom:8px}
.tag{display:inline-block;background:var(--grad);color:#fff;font-weight:600;font-size:14px;padding:5px 14px;border-radius:99px;margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
.logo{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.sw div{flex:1;min-width:110px}.sw i{display:block;height:64px;border-radius:12px;border:1px solid var(--line)}.sw span{display:block;font-size:13px;color:var(--mut);margin-top:6px;line-height:1.35}
.fullgrad{background:var(--grad);color:#fff;border-radius:28px;padding:clamp(28px,5vw,64px)}
.fullgrad .eyebrow,.fullgrad .mut,.fullgrad .lead{color:#fff}.fullgrad .rule{background:#fff}
.vid{position:relative;aspect-ratio:16/9;max-height:56vh;width:100%;background:#0D0F26;border-radius:22px;overflow:hidden;display:grid;place-items:center;color:#fff}
.vid video{width:100%;height:100%;object-fit:contain;background:#0D0F26}
.vid .ph-msg{text-align:center;padding:24px}
.vid .ph-msg b{display:block;font-family:var(--head);font-weight:300;font-size:clamp(28px,4vw,52px);margin:10px 0}
.play{width:92px;height:92px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto}
.play:after{content:"";border-left:28px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:8px}
.fileb{display:inline-block;margin-top:16px;border:1px solid #fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:15px}
.fileb input{position:absolute;opacity:0;width:1px;height:1px}
.fileb:focus-within{outline:3px solid #A9BBFF;outline-offset:2px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.story div{background:var(--bg2);border-radius:12px;padding:12px;font-size:14px;line-height:1.4;color:var(--mut)}.story b{display:block;color:var(--fg);margin-bottom:2px}
.demo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.step b{font-family:var(--head);font-size:28px;font-weight:300;color:var(--acc);min-width:28px}
.step span{font-size:15px;color:var(--mut);line-height:1.35}.step em{display:block;font-style:normal;font-weight:600;color:var(--fg);font-size:17px}
.step.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
canvas#cv{width:100%;height:min(440px,50vh);display:block;border-radius:18px;background:var(--bg2);cursor:grab;touch-action:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn2{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--grad);color:#fff}
.btn2.o{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400}
footer{border-top:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;min-width:200px}
.dots button{flex:1;height:8px;min-width:8px;border:0;border-radius:4px;background:var(--line);padding:0}
.dots button.done{background:var(--blue)}.dots button.on{background:var(--violet);height:12px}
.who{font-size:14px;color:var(--mut)}.who b{color:var(--fg)}
.nav2{display:flex;gap:8px}
#notes{display:none;width:340px;flex:none;border-left:1px solid var(--line);padding:20px 0 20px 20px;overflow:auto;font-size:15px;line-height:1.55;color:var(--mut)}
#notes.on{display:block}#notes h4{margin:0 0 10px;font-family:var(--head);font-size:22px;color:var(--fg);font-weight:500}
@media(max-width:900px){.split,.demo{grid-template-columns:1fr}#notes.on{position:fixed;inset:auto 0 0 0;width:auto;max-height:45vh;background:var(--bg);padding:16px;border-top:1px solid var(--line)}.where{order:3;flex-basis:100%}}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
header img,.logo{background:#fff}
header img{border-radius:8px;padding:2px}
.logo{border-radius:28px;padding:18px;box-shadow:0 18px 50px #3A63E833}
.pace{font-size:14px;font-weight:600;color:var(--mut)}.pace.ok{color:var(--ok)}.pace.late{color:var(--bad)}
.rule{background:linear-gradient(90deg,#3A63E8,#7A3FE0,#3A63E8);background-size:200% 100%}
.tile{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.tile:hover{transform:translateY(-4px);border-color:var(--blue)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.node{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.node b{display:block;font-family:var(--head);font-size:clamp(22px,2.4vw,30px);font-weight:500;color:var(--acc);margin-bottom:6px}
.node span{color:var(--mut);font-size:clamp(14px,1.3vw,18px);line-height:1.45}
.arr{flex:0 0 72px;align-self:center;height:4px;border-radius:2px;position:relative;background:linear-gradient(90deg,transparent,#3A63E8 50%,transparent) -40% 0/40% 100% no-repeat,var(--line)}
.arr:after{content:"";position:absolute;right:-3px;top:-6px;border-left:12px solid var(--violet);border-top:8px solid transparent;border-bottom:8px solid transparent}
.tl{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:14px;padding-top:36px}
.tl:before{content:"";position:absolute;top:11px;left:0;height:4px;width:100%;border-radius:2px;background:var(--grad);transform-origin:left}
.ti{position:relative}.ti:before{content:"";position:absolute;top:-34px;left:0;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--violet)}
.ti b{display:block;color:var(--acc);font-family:var(--head);font-size:24px;font-weight:500;margin-bottom:4px}
.ti span{color:var(--mut);font-size:15px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow)}
.stats .cu{display:block;font-family:var(--head);font-weight:300;font-size:clamp(44px,6vw,84px);line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.stats small{display:block;margin-top:6px;color:var(--mut);font-size:16px}
@media (prefers-reduced-motion:no-preference){
  .rule{animation:shim 4s linear infinite}@keyframes shim{to{background-position:200% 0}}
  .logo{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
  .scene h1,.scene h2{animation:rise .7s ease-out both}
  .scene .tile,.scene .node,.scene .ti,.scene .stats div,.scene .step{animation:rise .6s ease-out both}
  .scene .tile:nth-child(2),.scene .node:nth-child(3),.scene .ti:nth-child(2),.scene .stats div:nth-child(2){animation-delay:.12s}
  .scene .tile:nth-child(3),.scene .node:nth-child(5),.scene .ti:nth-child(3),.scene .stats div:nth-child(3){animation-delay:.24s}
  .scene .tile:nth-child(4),.scene .ti:nth-child(4),.scene .stats div:nth-child(4){animation-delay:.36s}
  .scene .tile:nth-child(5),.scene .ti:nth-child(5){animation-delay:.48s}
  .scene .tile:nth-child(6),.scene .ti:nth-child(6){animation-delay:.6s}
  .scene .tile:nth-child(7),.scene .ti:nth-child(7){animation-delay:.72s}
  .scene .ti:nth-child(8){animation-delay:.84s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .tl:before{animation:grow 1.6s ease-out both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .arr{animation:run 1.6s linear infinite}@keyframes run{to{background-position:140% 0,0 0}}
  .play{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 18px #7A3FE022}}
}
/* maqueta del teléfono: es un dispositivo con colores propios, igual en ambos temas */
.ph{width:360px;height:min(720px,calc(100dvh - 230px));min-height:520px;flex:none;background:#F5F6FC;color:#1B1F3B;border-radius:34px;border:8px solid #1B1F3B;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px #1B1F3B33;max-width:100%}
.ph .scr{flex:1;overflow:auto;padding:18px}
.ph .nav{display:flex;border-top:1px solid #DDE2F5;background:#fff}
.ph .nav button{flex:1;border:0;background:none;padding:9px 0;font-size:10px;color:#6B7094}
.ph .nav .on{color:#3A3FE0;font-weight:600}.ph .nav b{display:block;font-size:17px}
.ph .h{font-family:'Jost',sans-serif;font-size:26px;font-weight:500;margin:8px 0 2px;line-height:1.15}
.ph .m{color:#6B7094;font-size:12px}.ph .k{font-size:10px;letter-spacing:.1em;color:#6B7094;margin:10px 0 4px}
.ph .chip{display:inline-block;border:1px solid #C9CFEA;border-radius:16px;padding:5px 11px;font-size:11px;margin:0 4px 6px 0;background:#fff;color:#1B1F3B}
.ph .chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.ph .btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#1B1F3B;color:#fff;font-size:13px;margin:10px 0}
.ph .btn.g{background:var(--grad);font-weight:600}
.ph .in{width:100%;padding:11px;border:1px solid #C9CFEA;border-radius:10px;font:inherit;font-size:13px;margin:3px 0 8px;background:#fff;color:#1B1F3B}
.ph .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph .it{background:#fff;border-radius:10px;padding:8px;font-size:12px;position:relative;cursor:pointer}
.ph .pic{height:88px;background:#E6E9F7;border-radius:8px;display:grid;place-items:center;font-size:38px}
.ph .heart{position:absolute;top:12px;right:12px;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;cursor:pointer}
.ph .a{color:#6B7094;font-size:12px;text-decoration:underline;cursor:pointer;display:block;text-align:center;margin:8px 0}
.ph .bub{padding:10px 12px;border-radius:12px;font-size:12px;margin:6px 0;max-width:85%}
.ph .u{background:#1B1F3B;color:#fff;margin-left:auto}.ph .b{background:#fff}
.ph .card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;font-size:12px}
.ph .big{font-size:28px;font-weight:600}
.ph .mt{display:flex;align-items:flex-end;gap:5px;height:50px;margin-top:8px}.ph .mt i{flex:1;background:var(--grad);border-radius:2px}
.ph [data-pv],.ph [data-pa]{cursor:pointer}
/* citas */
.quote{margin:0 0 26px;padding:6px 0 6px 22px;border-left:4px solid var(--violet);max-width:62ch}
.quote p{margin:0;font-family:var(--head);font-weight:300;font-size:clamp(20px,2.2vw,30px);line-height:1.3;font-style:italic}
.quote .es{font-family:var(--text);font-style:normal;font-size:clamp(14px,1.3vw,17px);color:var(--mut);margin-top:6px}
.quote cite{display:block;margin-top:6px;font-style:normal;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600}
.fullgrad .quote{border-left-color:#fff}.fullgrad .quote .es,.fullgrad .quote cite{color:#fff}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <div class="brand"><img id="hl" alt="Logo de Monzati" src=""><span>MONZATI</span></div>
  <div class="where" id="where"></div>
  <div class="tools">
    <div class="clock" id="clock" aria-label="Tiempo restante">60:00</div>
    <button class="tb" id="bd" title="Duración de la exposición">60 min</button>
    <button class="tb" id="bt" title="Iniciar o pausar el reloj (T)">Iniciar</button>
    <button class="tb" id="bn" title="Notas del orador (N)">Notas</button>
    <button class="tb" id="bf" title="Pantalla completa (F)">Pantalla completa</button>
  </div>
</header>
<main><section id="stage" aria-live="polite"></section><aside id="notes" aria-label="Notas del orador"></aside></main>
<footer>
  <div class="nav2"><button class="tb" id="bp">← Anterior</button><button class="tb" id="bx">Siguiente →</button></div>
  <div class="dots" id="dots"></div>
  <div class="pace" id="pace"></div>
  <div class="who" id="who"></div>
</footer>

{id:"trailer",nav:"Trailer",who:"Todo el equipo",lang:"Video",t:"1:30",notes:"Reproducir a pantalla completa con audio. Carga el archivo del trailer con el botón. Guion: 10 s problema; 15 s avatar 3D; 15 s marketplace; 15 s espejo; 10 s logo y slogan. Tener el video también en la laptop.",

{id:"agenda",nav:"Agenda",who:"Angel",lang:"Español",t:"3:30",notes:"Mostrar el mapa, avisar que habrá una pregunta al grupo y una demo en vivo con la app. Total planeado 29 min, 1 de colchón.",

{id:"equipo",nav:"Equipo",who:"Todos",lang:"Español",t:"4:30",notes:"Cada integrante dice su nombre y rol en una frase (criterio 3.2). Roles: Angel líder de proyecto, Alejandro desarrollador, Mariana diseñadora, Maximiliano tester, Hanny analista. Poner fotos con uniforme. Abrir con la cita de San Agustín: conecta con el slogan «Vuelve a ti».",
 html:()=>`<p class="eyebrow">¿Quiénes somos?</p><h2>Equipo Monzati</h2><div class="rule"></div>${q("Love is itself the beauty of the soul.","El amor es la belleza misma del alma.","San Agustín")}<div class="tiles"><div class="tile"><h3>Angel</h3><p>Líder de proyecto y desarrollador</p></div><div class="tile"><h3>Alejandro</h3><p>Desarrollador</p></div><div class="tile"><h3>Mariana</h3><p>Diseñadora</p></div><div class="tile"><h3>Maximiliano</h3><p>Tester</p></div><div class="tile"><h3>Hanny</h3><p>Analista</p></div></div><p class="mut" style="margin-top:28px">Universidad Tecnológica de Tecámac · Proyecto final de graduación</p>`},
{id:"logo",nav:"Logo",who:"Mariana",lang:"Español",t:"7:00",notes:"Criterio 3.1: logo y significado. La silueta de maniquí es la moda, los circuitos son la tecnología, el degradado azul a violeta une los dos mundos. Ajustar a lo que el equipo decida.",
 html:()=>`<div class="split"><img class="logo" src="${LOGO}" alt="Logo de Monzati"><div><p class="eyebrow">¿Quiénes somos? · Logo</p><h2>Moda + Tecnología</h2><div class="rule"></div><p class="lead">Un maniquí con circuitos: la moda que se une a la tecnología.</p><p class="mut" style="margin-top:18px">El degradado de azul a violeta representa el paso de lo físico a lo digital. [Confirmar el significado con el equipo.]</p></div></div>`},
{id:"marca",nav:"Marca",who:"Mariana",lang:"Español",t:"8:30",notes:"Criterios 3.3 (slogan) y 1.2 (colores justificados). Decir el slogan completo y por qué cada color. Tipografías: Jost, ligera como la del logo, e Inter para texto. Cerrar con la cita de Keats: la marca quiere ser una alegría que dura.",
 html:()=>`<div class="fullgrad"><p class="eyebrow">¿Quiénes somos? · Nombre y slogan</p><h1 style="font-size:clamp(44px,8vw,120px);letter-spacing:.03em">Vuelve a ti.</h1><div class="rule"></div><p class="lead">Monzati: moda que parte de ti, de tu clóset, tu cuerpo y tus marcas locales.</p><div style="margin-top:26px">${q("A thing of beauty is a joy for ever.","Una cosa bella es una alegría para siempre.","John Keats")}</div><div class="sw" style="color:#fff">${sw("#3A63E8","Azul: confianza")}${sw("#7A3FE0","Violeta: creatividad")}${sw("#1B1F3B","Azul marino: elegancia")}${sw("#FFFFFF","Blanco: limpieza")}</div></div>`},
{id:"problema",nav:"Problema",who:"Max",lang:"Inglés",t:"10:00",notes:"Hablar despacio y claro. Hacer la pregunta al grupo y esperar 2 o 3 respuestas (criterio 6.2). Decir en inglés: “Too many clothes, nothing to wear. Hard to choose, hard to fit, hard to be seen.” No citar estadísticas sin fuente.",
 html:()=>`<p class="eyebrow">El problema</p><h2>Mucha ropa y nada que ponerse</h2><div class="rule"></div><div class="tiles"><div class="tile"><h3>Difícil elegir</h3><p>Olvidamos lo que tenemos y repetimos los mismos outfits.</p></div><div class="tile"><h3>Difícil acertar la talla</h3><p>Comprar en línea es adivinar la talla y devolver lo que no queda.</p></div><div class="tile"><h3>Difícil ser visto</h3><p>Las marcas locales casi no tienen visibilidad frente a las grandes cadenas.</p></div></div><p class="lead" style="margin-top:32px;color:var(--acc)">Pregunta para ustedes: ¿cuánta ropa tienen y nunca usan?</p>`},
{id:"solucion",nav:"Solución",who:"Mariana",lang:"Inglés",t:"14:00",notes:"Explicar cada pieza con un ejemplo en una frase. Las marcas de la demo son ficticias. El espejo se presenta como concepto si no está confirmado. En inglés: “One ecosystem, four pieces: closet, 3D avatar, marketplace and partner app.” Antes de explicar, leer la cita de Coco Chanel como transición: Monzati se distingue por ser diferente.",
 html:()=>`${q("In order to be irreplaceable, one must always be different.","Para ser irremplazable, hay que ser siempre diferente.","Coco Chanel")}<p class="eyebrow">Nuestra solución</p><h2>Un ecosistema, cuatro piezas</h2><div class="rule"></div><div class="tiles"><div class="tile"><span class="tag">Clóset</span><p>Fotografía tu ropa y mantenla organizada.</p></div><div class="tile"><span class="tag">Avatar 3D</span><p>Pruébate outfits en un cuerpo hecho con tus medidas.</p></div><div class="tile"><span class="tag">Marketplace</span><p>Compra a marcas locales con la talla correcta.</p></div><div class="tile"><span class="tag">App de socios</span><p>Las marcas suben productos y gestionan pedidos.</p></div></div><p class="mut" style="margin-top:28px">Además, un concepto de espejo inteligente para probarse ropa en tienda. Modelo de negocio: una comisión por cada venta.</p>`},
{id:"modulos",nav:"Módulos",who:"Mariana",lang:"Inglés",t:"18:00",notes:"Recorrer los siete módulos sin leerlos: una frase por módulo. Conectar cada uno con una pantalla que se verá en la demo. En inglés: “Seven modules, one app.”",
 html:()=>`<p class="eyebrow">Qué incluye</p><h2>Siete módulos, una sola app</h2><div class="rule"></div><div class="tiles"><div class="tile"><span class="tag">Acceso y roles</span><p>Cuenta de usuario o de socio comercial.</p></div><div class="tile"><span class="tag">Clóset virtual</span><p>Fotos con fondo recortado, categorías y favoritos.</p></div><div class="tile"><span class="tag">Asistente de IA</span><p>Sugiere combinaciones con tu propia ropa.</p></div><div class="tile"><span class="tag">Probador 3D</span><p>Avatar con tus medidas y prendas en 3D.</p></div><div class="tile"><span class="tag">Marketplace</span><p>Catálogo de marcas locales, carrito y pago de prueba.</p></div><div class="tile"><span class="tag">Panel de socios</span><p>Productos, inventario por talla y ventas.</p></div><div class="tile"><span class="tag">Espejo inteligente</span><p>Proyecta el atuendo elegido en una pantalla.</p></div></div>`},
{id:"proceso",nav:"Proceso",who:"Hanny",lang:"Inglés",t:"22:00",notes:"Criterio 2.2: explicar el proceso. Roles, 20% de colchón, demos por sprint y el tablero Scrum propio. Fechas de 2027 por confirmar. En inglés: “We work in two-week sprints, with a demo at the end of each stage.”",
 html:()=>`<p class="eyebrow">Cómo trabajamos · Scrum</p><h2>Sprints de dos semanas, cinco personas</h2><div class="rule"></div><div class="tiles"><div class="tile"><div class="num">S0–S2</div><h3>Base</h3><p>Stack, modelo de datos, acceso y API base.</p></div><div class="tile"><div class="num">S3–S5</div><h3>Clóset y 3D</h3><p>Fotos, plantillas de prendas y catálogo. Demo 1.</p></div><div class="tile"><div class="num">S6–S8</div><h3>Probador y tienda</h3><p>Avatar, carrito, pago y comisiones. Demo 2.</p></div><div class="tile"><div class="num">S9–S10</div><h3>Pulido</h3><p>Espejo, pruebas y beta. Versión 1.0.</p></div></div><p class="mut" style="margin-top:28px">Desarrollo: nov 2026 – abr 2027 · Colchón: mayo y junio · Defensa: julio y agosto</p>`},
{id:"cronograma",nav:"Cronograma",who:"Hanny",lang:"Inglés",t:"26:00",notes:"Recorrer la línea de tiempo de izquierda a derecha. Resaltar las dos decisiones: el 3D y el espejo. Las fechas de 2027 siguen por confirmar con el calendario de la universidad. En inglés: “Three demos, one feature freeze, version 1.0 on April 30.”",
 html:()=>`<p class="eyebrow">Cronograma</p><h2>De noviembre a la defensa</h2><div class="rule"></div><div class="tl"><div class="ti"><b>20 nov</b><span>Decisión: ¿el 3D es viable?</span></div><div class="ti"><b>29 ene</b><span>Demo 1: catálogo con visor 3D</span></div><div class="ti"><b>5 mar</b><span>Demo 2: compra y comisiones. Decisión del espejo</span></div><div class="ti"><b>9 abr</b><span>Demo 3: espejo e integración</span></div><div class="ti"><b>16 abr</b><span>Congelamiento de funciones</span></div><div class="ti"><b>30 abr</b><span>Versión 1.0</span></div><div class="ti"><b>May – jun</b><span>Colchón y correcciones</span></div><div class="ti"><b>Jul – ago</b><span>Defensa del proyecto</span></div></div><p class="mut" style="margin-top:28px">Fechas de 2027 por confirmar con el calendario de la universidad.</p>`},
{id:"tecnologia",nav:"Tecnología",who:"Alejandro",lang:"Inglés",t:"29:00",notes:"Solo el panorama: por qué un backend con dos roles y por qué plantillas 3D en lugar de escanear. Una razón por tarjeta. En inglés: “One backend, one login, two roles.”",
 html:()=>`<p class="eyebrow">Tecnología</p><h2>Un backend, un acceso, dos roles</h2><div class="rule"></div><div class="tiles"><div class="tile"><h3>App móvil</h3><p>React Native + Expo con TypeScript. Primero Android.</p></div><div class="tile"><h3>3D</h3><p>Three.js con modelos glTF hechos en Blender.</p></div><div class="tile"><h3>Backend</h3><p>API en Node + TypeScript, PostgreSQL y Supabase.</p></div><div class="tile"><h3>Pagos</h3><p>Stripe en modo de pruebas para el pago.</p></div></div><p class="mut" style="margin-top:28px">Una persona usuaria y un socio comercial usan la misma app: el tipo de cuenta decide lo que ven.</p>`},
{id:"arquitectura",nav:"Arquitectura",who:"Alejandro",lang:"Inglés",t:"32:00",notes:"Seguir el flujo: la app habla con una sola API, y la API con la base de datos. Debajo, lo que se conecta: el 3D vive en la app, los pagos son de prueba y el espejo recibe el atuendo en tiempo real. En inglés: “The app talks to one API; the API talks to the database.”",
 html:()=>`<p class="eyebrow">Arquitectura</p><h2>Cómo se conecta todo</h2><div class="rule"></div><div class="flow"><div class="node"><b>App móvil</b><span>React Native + Expo<br>Usuario o socio</span></div><i class="arr"></i><div class="node"><b>API</b><span>Node + TypeScript<br>Un acceso, dos roles</span></div><i class="arr"></i><div class="node"><b>Datos</b><span>PostgreSQL y Supabase<br>Cuentas y archivos</span></div></div><p class="eyebrow" style="margin:26px 0 12px">Conectado con</p><div class="tiles"><div class="tile"><h3>Visor 3D</h3><p>Three.js con modelos glTF dentro de la app.</p></div><div class="tile"><h3>Pagos</h3><p>Stripe en modo de pruebas.</p></div><div class="tile"><h3>Espejo</h3><p>Recibe el atuendo por WebSocket.</p></div></div>`},
{id:"demo",nav:"Demo en vivo",who:"Angel y Mariana",lang:"Inglés",t:"35:00",notes:"Criterio 2.1: mostrar las interfaces funcionando. Seguir los 7 pasos, unos 80 s cada uno. Angel maneja la app y Mariana narra en inglés. Tener un video de respaldo de la demo.",
 html:()=>`<div class="demo"><div id="phone"></div><div><p class="eyebrow">Demo en vivo</p><h2 style="margin-bottom:18px">Abramos la app</h2><div class="steps" id="steps"></div></div></div>`,
 after:()=>{renderPhone();renderSteps()}},
{id:"espejo",nav:"Espejo 3D",who:"Alejandro",lang:"Inglés",t:"45:00",notes:"Repaso de lo más llamativo de la demo y la idea del espejo. Si la versión no está decidida, presentarla como siguiente paso. En inglés: “See it on you before you buy.” Arrastra el espejo para rotarlo. Empezar con la cita de Iman: el espejo sirve para probarse ropa sin inseguridad.",
 html:()=>`<div class="split"><div><canvas id="cv" aria-label="Modelo 3D del espejo inteligente"></canvas><div class="row"><button class="btn2" data-pa="proj">Proyectar atuendo</button><button class="btn2 o" data-pa="spin">Rotación automática</button></div></div><div><p class="eyebrow">Probador 3D · Espejo inteligente</p><h2 style="font-size:clamp(30px,4vw,54px)">Velo en ti antes de comprar</h2><div class="rule"></div>${q("Beauty is being comfortable and confident in your own skin.","La belleza es sentirse cómodo y seguro de tu propia piel.","Iman")}<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile" style="padding:16px"><h3 style="font-size:22px">Mide</h3><p>Tu estatura y medidas adaptan el avatar.</p></div><div class="tile" style="padding:16px"><h3 style="font-size:22px">Viste</h3><p>Plantillas 3D en varias tallas.</p></div><div class="tile" style="padding:16px"><h3 style="font-size:22px">Decide</h3><p>Talla recomendada y outfit guardado.</p></div></div><p class="mut" style="margin-top:20px">Cómo se construye: espejo de dos vías, monitor de alto brillo detrás, mini PC, cámara y marco con ventilación. La app envía el atuendo por WebSocket y el espejo lo dibuja con Three.js. Costos por cotizar.</p></div></div>`,
 after:()=>init3d()},
{id:"negocio",nav:"Negocio",who:"Hanny",lang:"Español",t:"48:00",notes:"Resumen en español del modelo de negocio. Seguir el flujo del dinero de izquierda a derecha. Confirmar el porcentaje de comisión con el equipo antes de decirlo; no se incluyó aquí.",
 html:()=>`<p class="eyebrow">Negocio</p><h2>Cómo gana Monzati</h2><div class="rule"></div><div class="flow"><div class="node"><b>Persona usuaria</b><span>Compra una prenda con su talla</span></div><i class="arr"></i><div class="node"><b>Monzati</b><span>Cobra y retiene una comisión</span></div><i class="arr"></i><div class="node"><b>Marca local</b><span>Recibe el resto de la venta</span></div></div><div class="tiles" style="margin-top:24px"><div class="tile"><h3>Usuarios</h3><p>Gratis: clóset, avatar y compras.</p></div><div class="tile"><h3>Marcas locales</h3><p>Venden sin costo fijo y reciben visibilidad.</p></div><div class="tile"><h3>Monzati</h3><p>Una comisión por cada venta realizada.</p></div></div><p class="mut" style="margin-top:22px">Para la tesis, las marcas son ficticias; el flujo de compra y de comisiones funciona completo en modo de pruebas.</p>`},
{id:"calidad",nav:"Calidad y riesgos",who:"Max",lang:"Español",t:"51:00",notes:"Como tester, mostrar que el equipo ya pensó qué puede salir mal. Dos columnas: cómo se prueba y qué riesgos hay con su plan. Ser honestos con el espejo: es la decisión abierta hasta el 5 de marzo.",
 html:()=>`<p class="eyebrow">Calidad y riesgos</p><h2>Qué probamos y qué puede fallar</h2><div class="rule"></div><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="tile"><h3>Cómo probamos</h3><p>Pruebas unitarias con Vitest o Jest, pruebas de la app móvil con Maestro, pruebas del panel con Playwright y una ronda completa de extremo a extremo en el sprint 10.</p></div><div class="tile"><h3>Riesgo: el 3D</h3><p>Es lo más difícil. El 20 de noviembre decidimos si es viable; si no, hay un plan B con menos prendas.</p></div><div class="tile"><h3>Riesgo: el espejo</h3><p>Se decide el 5 de marzo entre pantalla simulada, cámara o hardware real.</p></div><div class="tile"><h3>Riesgo: el tiempo</h3><p>Un colchón de 20% en cada sprint y mayo y junio libres para corregir.</p></div></div>`},
{id:"avance",nav:"Avance",who:"Max",lang:"Español",t:"53:00",notes:"Ajustar “Hecho” y “En marcha” al estado real el día de la expo. Las cifras salen del plan del equipo; revisarlas antes. Fechas de 2027 por confirmar con el calendario de la universidad.",
 html:()=>`<p class="eyebrow">Avance y siguientes pasos</p><h2>Dónde estamos hoy</h2><div class="rule"></div><div class="stats"><div><span class="cu" data-n="5">0</span><small>integrantes</small></div><div><span class="cu" data-n="232">0</span><small>tareas planeadas</small></div><div><span class="cu" data-n="2">0</span><small>semanas por sprint</small></div><div><span class="cu" data-n="20" data-s="%">0</span><small>de colchón</small></div></div><div class="tiles" style="margin-top:24px"><div class="tile"><h3>Hecho</h3><p>Plan maestro, tablero Scrum, diseño de pantallas y prototipo interactivo.</p></div><div class="tile"><h3>En marcha</h3><p>Pruebas de 3D y detección de pose, autenticación con roles.</p></div><div class="tile"><h3>Siguiente</h3><p>Demo 1 el 29 de enero, versión 1.0 el 30 de abril.</p></div></div>`},
{id:"cierre",nav:"Cierre",who:"Angel",lang:"Español e inglés",t:"55:00",notes:"Repetir el slogan, agradecer y abrir preguntas; cerrar con “Thank you”. Leer la cita de Emerson justo antes de abrir preguntas. Dejar 3 a 5 minutos para preguntas. Al final el docente firma el acuerdo de calificación.",
 html:()=>`<div class="fullgrad"><p class="eyebrow">Gracias</p><h1 style="font-size:clamp(44px,8vw,120px);letter-spacing:.03em">Vuelve a ti.</h1><div class="rule"></div><p class="lead">Monzati · Angel · Alejandro · Mariana · Max · Hanny</p><div style="margin-top:26px">${q("Never lose an opportunity of seeing anything beautiful, for beauty is God’s handwriting.","Nunca dejes pasar la oportunidad de ver algo bello, porque la belleza es la letra de Dios.","Ralph Waldo Emerson")}</div><p class="lead" style="margin-top:8px">¿Preguntas? · Questions?</p></div>`}

/* ---------- Navegación y reloj ---------- */
let cur=0,DUR=3600;
const secs=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const mm=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const startOf=k=>secs(SCENES[k].t)*DUR/3600;
const endOf=k=>k<SCENES.length-1?startOf(k+1):DUR;
function show(i){cur=Math.max(0,Math.min(SCENES.length-1,i));const s=SCENES[cur];cancelAnimationFrame(raf);
  $("#stage").innerHTML=`<div class="scene">${s.html()}</div>`;if(s.after)s.after();countUp();
  $("#where").textContent=`${cur+1} / ${SCENES.length} · ${s.nav}`;
  $("#who").innerHTML=`<b>${s.who}</b> · ${s.lang} · min ${mm(startOf(cur))}`;
  $("#notes").innerHTML=`<h4>${s.nav}</h4>${s.notes}`;
  $("#dots").innerHTML=SCENES.map((x,k)=>`<button data-s="${k}" class="${k<cur?"done":""} ${k===cur?"on":""}" aria-label="${x.nav}" title="${x.nav}"></button>`).join("");
  try{history.replaceState(null,"","#"+s.id)}catch(e){location.hash=s.id}tick()}
const fromHash=()=>{const k=SCENES.findIndex(s=>"#"+s.id===location.hash);return k<0?0:k};
function countUp(){const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;document.querySelectorAll(".cu").forEach(e=>{const n=+e.dataset.n,sf=e.dataset.s||"";if(rm){e.textContent=n+sf;return}const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/1400);e.textContent=Math.round(n*(1-Math.pow(1-p,3)))+sf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
let run=false,el=0,last=0;
function fmt(s){const a=Math.abs(s),m=String(Math.floor(a/60)).padStart(2,"0"),x=String(a%60).padStart(2,"0");return (s<0?"+":"")+m+":"+x}
function tick(){const now=Date.now();if(run){el+=(now-last)/1000}last=now;const left=Math.round(DUR-el),c=$("#clock");c.textContent=fmt(left);c.className="clock"+(left<0?" over":left<300?" warn":"");
  const p=$("#pace");if(el<1){p.textContent="";return}const dl=el-endOf(cur),ad=startOf(cur)-el;
  if(dl>30){p.textContent="Atraso de "+mm(dl);p.className="pace late"}else if(ad>60){p.textContent="Adelanto de "+mm(ad);p.className="pace"}else{p.textContent="En tiempo";p.className="pace ok"}}
setInterval(tick,500);
$("#bt").onclick=()=>{run=!run;last=Date.now();$("#bt").textContent=run?"Pausar":(el>0?"Continuar":"Iniciar")};
$("#bd").onclick=()=>{DUR=DUR===3600?1800:3600;$("#bd").textContent=(DUR/60)+" min";show(cur)};

s071:()=>`<div class="scr"><div class="h">Nuevo producto</div><div class="m">Comparte tu próxima pieza favorita.</div><div class="k">NOMBRE</div><input class="in" id="pn" value="Chamarra de lino"><div class="k">PRECIO · MXN</div><input class="in" id="pp" value="2100"><div class="k">TALLAS</div>${chips(["XS","S","M","L"],"M","x")}<button class="btn g" data-pa="pub">Publicar producto</button><div class="m">Aparecerá en el catálogo de la tienda al publicar.</div></div>${nb("s071")}`,
s08:()=>`<div class="scr"><div class="h">Tu reflejo, reinventado.</div><div class="card">◎ MONZATI Mirror 01 · <b style="color:#1F7A3A">Conectado</b></div><div class="pic" style="height:250px;font-size:110px;background:#141733;color:#fff;position:relative;${S.mir?"box-shadow:0 0 0 3px #7A3FE0 inset":""}">${S.mir?"🧍":"<span style=font-size:14px>Pantalla en espera</span>"}${S.mir?`<span class="chip on" style="position:absolute;left:10px;top:10px;font-size:9px">EN VIVO</span>`:""}</div><div class="m" style="margin-top:8px">Cambia tu look desde el móvil y visualízalo al instante en tu espejo.</div><button class="btn g" data-pa="mir">${S.mir?"Detener proyección":"Proyectar atuendo"}</button></div>${nav("s08")}`};
const STEPS=[["s01","Acceso","Dos tipos de cuenta"],["s02","Clóset","Prendas y favoritos"],["s04","Asistente de IA","Combina tu ropa"],["s05","Probador 3D","Medidas y talla"],["s06","Tienda","Marcas locales"],["s07","Panel de socio","Ventas e inventario"],["s08","Espejo","Proyección del atuendo"]];
const grp={s011:"s01",s012:"s01",s03:"s02",s061:"s06",s071:"s07"};
function renderPhone(){const p=$("#phone");if(p)p.innerHTML=`<div class="ph">${SC[S.v]()}</div>`;renderSteps()}
function renderSteps(){const e=$("#steps");if(!e)return;const on=grp[S.v]||S.v;e.innerHTML=STEPS.map(([i,t,d],k)=>`<button class="step ${i===on?"on":""}" data-pv="${i}"><b>${k+1}</b><span><em>${t}</em>${d}</span></button>`).join("")}
const ans=["Combina tu blusa de seda con el pantalón sastre y tus botines. Sofisticado, sin esfuerzo.","Prueba el vestido midi con los botines de piel: elegante y cómodo.","Para algo casual: pantalón sastre con la blusa de seda y tenis blancos."];
function pact(a,v){
  if(a==="proj"){proj=!proj;return}if(a==="spin"){spin=!spin;return}
  if(a==="login"){S.v=S.role==="u"?"s02":"s07";return renderPhone()}
  if(a==="role")S.role=v==="Usuario final"?"u":"s";
  if(a==="cat")S.cat=v;if(a==="size")S.size=v;if(a==="sent")S.sent=true;if(a==="mir")S.mir=!S.mir;if(a==="bag")S.bag++;
  if(a==="fav")S.fav=S.fav.includes(v)?S.fav.filter(x=>x!==v):[...S.fav,v];
  if(a==="send"||a==="ask"){const i=$("#q"),t=i&&i.value.trim();if(t)S.chat.push(["u",t]);else if(v)S.chat.push(["u",v]);S.chat.push(["b",ans[S.chat.length%3]])}
  if(a==="pub"){shop.push(["Tu marca",$("#pn").value||"Producto nuevo","🧥",+$("#pp").value||0]);S.v="s06";return renderPhone()}
  renderPhone()}

/* ---------- Espejo 3D ---------- */
let raf,spin=true,proj=true;
function init3d(){const c=$("#cv");if(!c||!window.THREE)return;const w=c.clientWidth,h=c.clientHeight;
  const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});r.setSize(w,h,false);r.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,w/h,.1,50);cam.position.set(0,1.1,7);cam.lookAt(0,1,0);
  sc.add(new THREE.AmbientLight(0xffffff,.7));const d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(3,4,5);sc.add(d);
  const g=new THREE.Group();sc.add(g);
  const M=(c,m,ro)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:ro}),B=(w,h,e,mt,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,e),mt);o.position.set(x,y,z);g.add(o);return o};
  const f=M(0x7A3FE0,.7,.3);B(2.3,.14,.25,f,0,2.25,0);B(2.3,.14,.25,f,0,-.25,0);B(.14,2.64,.25,f,-1.08,1,0);B(.14,2.64,.25,f,1.08,1,0);
  B(2.02,2.36,.05,new THREE.MeshStandardMaterial({color:0x1B1F3B,metalness:1,roughness:.06,transparent:true,opacity:.9}),0,1,0);
  const leg=M(0x2A2F55,.5,.5);B(.1,2.4,.1,leg,-.7,.9,-.35).rotation.x=.2;B(.1,2.4,.1,leg,.7,.9,-.35).rotation.x=.2;B(1.9,.08,1.1,leg,0,-.5,-.1);
  const led=new THREE.MeshBasicMaterial({color:0xA9BBFF});B(.04,2.4,.04,led,-1.0,1,.14);B(.04,2.4,.04,led,1.0,1,.14);
  const cm=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),M(0x000000,.9,.2));cm.position.set(0,2.4,.12);g.add(cm);
  const av=new THREE.Group(),gm=new THREE.MeshBasicMaterial({color:0x3A63E8});
  [[0,1.95,0,.16],[0,1.45,0,.3]].forEach(a=>{const s=new THREE.Mesh(new THREE.SphereGeometry(a[3],16,16),gm);s.position.set(a[0],a[1],.05);av.add(s)});
  const lg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,1,16),gm);lg.position.set(0,.6,.05);av.add(lg);g.add(av);
  let dr=false,lx=0;c.onpointerdown=e=>{dr=true;lx=e.clientX;spin=false};addEventListener("pointerup",()=>dr=false);c.onpointermove=e=>{if(dr){g.rotation.y+=(e.clientX-lx)*.01;lx=e.clientX}};
  const loop=()=>{if(!$("#cv"))return;if(spin)g.rotation.y+=.006;av.visible=proj;r.render(sc,cam);raf=requestAnimationFrame(loop)};loop()}

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  const pv=e.target.closest("[data-pv]");if(pv){if(pv.dataset.v!==undefined)S.p=+pv.dataset.v;S.v=pv.dataset.pv;renderPhone();return}
  const pa=e.target.closest("[data-pa]");if(pa){pact(pa.dataset.pa,pa.dataset.v);return}
  const d=e.target.closest("[data-s]");if(d)show(+d.dataset.s)});
$("#bp").onclick=()=>show(cur-1);$("#bx").onclick=()=>show(cur+1);
$("#bn").onclick=()=>$("#notes").classList.toggle("on");
$("#bf").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener("input",e=>{if(e.target.id==="hs"){S.h=+e.target.value;$("#av").style.transform=`scaleY(${(S.h/168).toFixed(2)})`;$("#hv").textContent=S.h+" cm"}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="q"&&e.key==="Enter"){pact("send");return}
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"||e.key==="PageDown")show(cur+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")show(cur-1);
  else if(e.key==="n"||e.key==="N")$("#bn").click();
  else if(e.key==="t"||e.key==="T")$("#bt").click();
  else if(e.key==="f"||e.key==="F")$("#bf").click()});

/* ---------- Fondo animado ---------- */
(function(){const c=$("#bg"),x=c.getContext("2d");let W,H,P=[],O=[],mx=0,my=0,on=true;const rm=matchMedia("(prefers-reduced-motion: reduce)");
const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function size(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  P=Array.from({length:Math.round(Math.min(70,W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:1+Math.random()*1.6}));
  O=[{x:.2,y:.25,r:.38,c:"58,99,232",s:.00021,a:0},{x:.8,y:.7,r:.42,c:"122,63,224",s:.00017,a:2},{x:.6,y:.15,r:.28,c:"90,160,255",s:.00025,a:4}]}
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function frame(t){const d=dark();x.clearRect(0,0,W,H);const oa=d?.30:.16;
  O.forEach(o=>{const px=(o.x+Math.cos(t*o.s+o.a)*.08-mx*.03)*W,py=(o.y+Math.sin(t*o.s*1.3+o.a)*.08-my*.03)*H,r=o.r*Math.max(W,H)*.6,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,"rgba("+o.c+","+oa+")");g.addColorStop(1,"rgba("+o.c+",0)");x.fillStyle=g;x.fillRect(0,0,W,H)});
  const lc=d?"169,187,255":"91,63,224",la=d?.35:.22;
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
  for(let i=0;i<P.length;i++){const a=P[i];x.fillStyle="rgba("+lc+","+(la+.2)+")";x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill();
    for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,dd=dx*dx+dy*dy;if(dd<20000){x.strokeStyle="rgba("+lc+","+(la*(1-dd/20000))+")";x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}}
function loop(t){if(on&&!rm.matches)frame(t);requestAnimationFrame(loop)}
size();addEventListener("resize",size);document.addEventListener("visibilitychange",()=>{on=!document.hidden});frame(0);requestAnimationFrame(loop)})();
addEventListener("hashchange",()=>show(fromHash()));
show(fromHash());tick();
